<!doctype html><html><head><style>html,body{margin:0;height:100%;background:#222}iframe{width:100%;height:100%;border:0}</style>
<script src="../../web/vendor/sketchfab-viewer-1.12.1.js"></script></head><body><iframe id="f" allow="autoplay"></iframe>
<script>
const id = new URLSearchParams(location.search).get('id');
window.state = 'init';
const client = new Sketchfab(document.getElementById('f'));
client.init(id, {autostart: 1, preload: 1, ui_infos: 0, ui_controls: 0, ui_stop: 0, ui_hint: 0,
  success: api => { window.api = api; api.addEventListener('viewerready', () => { api.getCameraLookAt((e, c) => { window.readyCam = c; window.state = 'ready'; }); }); api.start(); },
  error: e => { window.state = 'error ' + e; }});
const call = (name, ...args) => new Promise((res, rej) => window.api[name](...args, (err, v) => err ? rej(err) : res(v)));
window.call = call;
window.callNoErr = (name, ...args) => new Promise(res => window.api[name](...args, v => res(v)));
</script></body></html>
